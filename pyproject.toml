[project]
name = "rag-assistant"
version = "0.1.0"
description = "Agentic RAG research assistant (LangGraph + ChromaDB)"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "llm: tests that call a real LLM API (skipped when no valid API key is set)",
]
