# ---------------------------------------------------------------------------
# Main configuration for the Agentic RAG Research Assistant.
# Every value here can be overridden by an environment variable of the same
# name in UPPER_CASE with an "RAG_" prefix, e.g. RAG_LLM_PROVIDER=gemini.
# ---------------------------------------------------------------------------

# --- LLM used by the agent ---------------------------------------------------
llm_provider: gemini               # groq | gemini | openai | ollama
llm_model: gemini-3.5-flash-lite    # free tier: gemini-3.5-flash allows only 20 requests/day
llm_temperature: 0.0               # 0 = as deterministic as possible

# --- LLM used as the judge during evaluation (kept fixed across experiments) -
judge_provider: gemini
judge_model: gemini-3.5-flash-lite

# --- Embeddings & vector store -----------------------------------------------
embedding_model: sentence-transformers/all-MiniLM-L6-v2
chroma_dir: chroma_db              # folder for the persistent ChromaDB store
chunk_size: 500                    # characters per chunk (see docs/DECISIONS.md)
chunk_overlap: 75                  # characters shared by neighbouring chunks (15%)

# --- Agent behaviour ---------------------------------------------------------
top_k: 8                           # passages retrieved per search
max_retries: 1                     # max query rewrites before giving up (see DECISIONS D10)
use_rewrite_loop: true             # false = plain "retrieve once" RAG
check_grounding: true              # verify the answer against the passages
sanitize_injections: true          # redact instruction-like text in passages
memory_turns: 3                    # previous Q/A pairs remembered per session

# --- Paths -------------------------------------------------------------------
raw_data_dir: data/raw             # downloaded Wikipedia articles
poisoned_data_dir: data/poisoned   # prompt-injection test documents
log_dir: logs                      # per-question JSONL traces
cache_dir: .cache/llm              # on-disk LLM response cache (for evals)
use_llm_cache: false               # the eval script switches this on

# --- Prices in US$ per 1M tokens (input, output), used for cost logging -----
# Check your provider's pricing page; these are list prices at time of writing.
prices:
  # Gemini prices from third-party trackers citing ai.google.dev/gemini-api/docs/pricing (verify)
  gemini-3.5-flash: [1.50, 9.00]
  gemini-3.5-flash-lite: [0.30, 2.50]
  gemini-3.1-flash-lite: [0.25, 1.50]
  llama-3.3-70b-versatile: [0.59, 0.79]
  llama-3.1-8b-instant: [0.05, 0.08]
  openai/gpt-oss-120b: [0.15, 0.75]
  openai/gpt-oss-20b: [0.10, 0.50]
  gemini-2.0-flash: [0.10, 0.40]
  gpt-4o-mini: [0.15, 0.60]
